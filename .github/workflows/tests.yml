name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: frontend logic (decision-time information boundary)
        run: node --test tests/web/core.test.js
      - name: synthetic end-to-end run (engine demo only; not evidence)
        run: python run_study.py --period synthetic
